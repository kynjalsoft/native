name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Translation key coverage
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      - name: Export iOS and Android bundles
        run: npx expo export --platform ios --platform android --output-dir /tmp/zyndmail-ci-export

  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v4

      - run: npm ci

      - name: Compile Android without publishing
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
